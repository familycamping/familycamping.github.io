<style>
/* Layout: picture-book sky hero with the two kids on a hill, white rounded cards below, floating pill tab bar. Sunny by day, starry night in dark mode. */
:root{
  --sky1:#a9dcf3; --sky2:#e3f4fb; --cloud:#ffffff; --star:transparent;
  --bg:#f3f8ef; --surface:#ffffff; --ink:#2d3142; --muted:#6b7183; --line:#e2e7df;
  --grass:#8fd18a; --grass-deep:#5aa85a;
  --sun:#ffc93c; --sun-deep:#dc9d00; --on-sun:#3a2c08;
  --heart:#e8473a; --heart-soft:#fde4e0; --sky:#2f8fc9; --sky-soft:#e0f0fa;
  --danger:#d33a2c; --shadow:rgba(45,49,66,.09);
  --c1:#ffb938; --c2:#5bb4e5; --c3:#f08a6c; --c4:#6cc56c; --c5:#a88ad8;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky1:#18213f; --sky2:#2a3763; --cloud:rgba(255,255,255,.13); --star:rgba(255,255,255,.85);
  --bg:#141929; --surface:#1f2537; --ink:#eef0f6; --muted:#a4aabd; --line:#2f364b;
  --grass:#3d7a4a; --grass-deep:#2b5a36;
  --sun:#ffd45e; --sun-deep:#c4951a; --on-sun:#2a1f05;
  --heart:#ff6b5e; --heart-soft:#45262b; --sky:#7cc4ee; --sky-soft:#22324a;
  --danger:#ff7b6c; --shadow:rgba(0,0,0,.35);
  --c1:#e9a72e; --c2:#4a9fd0; --c3:#e07a5e; --c4:#56ad5a; --c5:#9479c6; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky1:#18213f; --sky2:#2a3763; --cloud:rgba(255,255,255,.13); --star:rgba(255,255,255,.85);
  --bg:#141929; --surface:#1f2537; --ink:#eef0f6; --muted:#a4aabd; --line:#2f364b;
  --grass:#3d7a4a; --grass-deep:#2b5a36;
  --sun:#ffd45e; --sun-deep:#c4951a; --on-sun:#2a1f05;
  --heart:#ff6b5e; --heart-soft:#45262b; --sky:#7cc4ee; --sky-soft:#22324a;
  --danger:#ff7b6c; --shadow:rgba(0,0,0,.35);
  --c1:#e9a72e; --c2:#4a9fd0; --c3:#e07a5e; --c4:#56ad5a; --c5:#9479c6; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.syncchip{display:inline-block;vertical-align:top;font-size:11px;border-radius:999px;padding:2px 9px;margin-left:4px;background:var(--surface);color:var(--muted);box-shadow:0 2px 0 var(--shadow);letter-spacing:.02em}
.syncchip.s-ok{color:var(--grass-deep)}.syncchip.s-error,.syncchip.s-badkey{color:var(--heart)}
.bk{margin-top:26px;padding:16px;display:grid;gap:10px}
.bk h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px;display:flex;align-items:center;gap:8px}
.bk p{margin:0;font-size:13px;color:var(--muted)}
.bk .warn{color:var(--heart);font-weight:700}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky1)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2));border-radius:0 0 34px 34px}
.hero-in{position:relative;z-index:2;max-width:620px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:20px 0;display:flex;align-items:flex-start;gap:10px}
.hero h1{flex:1;min-width:0;margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15;color:var(--ink);letter-spacing:.03em}
.hero h1 .brand{display:inline-block;font-size:12px;letter-spacing:.12em;background:var(--surface);color:var(--sky);border-radius:999px;padding:2px 10px;margin-bottom:6px;box-shadow:0 2px 0 var(--shadow)}
.hero h1 small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);margin-top:4px;letter-spacing:.04em}
.sunball{position:absolute;right:22px;top:58px;width:46px;height:46px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 8px color-mix(in srgb,var(--sun) 25%,transparent),0 0 0 16px color-mix(in srgb,var(--sun) 12%,transparent);z-index:1}
.cloud{position:absolute;z-index:1;background:var(--cloud);border-radius:999px;height:16px}
.cloud::before,.cloud::after{content:"";position:absolute;background:var(--cloud);border-radius:50%}
.cloud::before{width:22px;height:22px;left:10px;top:-11px}.cloud::after{width:16px;height:16px;left:26px;top:-7px}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--star)}
.scene{position:relative;z-index:2;display:block;width:min(100%,500px);height:auto;aspect-ratio:400/176;margin:6px auto 0}
.hill{position:absolute;left:0;right:0;bottom:0;width:100%;height:58px;display:block;z-index:1}

/* buttons */
.btn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.sun{background:var(--sun);border-color:var(--sun-deep);color:var(--on-sun);box-shadow:0 3px 0 var(--sun-deep);font-weight:700}
.btn.sun:active:not(:disabled){box-shadow:0 1px 0 var(--sun-deep)}
.btn.on{background:var(--sky-soft);border-color:var(--sky);color:var(--sky);box-shadow:0 3px 0 var(--sky)}
.btn.ghost{background:transparent;border-style:dashed;box-shadow:none}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}

/* pack card */
.card{background:var(--surface);border-radius:22px;box-shadow:0 4px 0 var(--line),0 10px 24px var(--shadow)}
.pack{margin-top:16px;padding:16px;display:grid;gap:14px}
.seg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg>span{font-size:13px;color:var(--muted);font-weight:500}
.seg-in{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px}
.seg-in button{border:0;background:none;border-radius:999px;padding:5px 14px;font-size:14px;color:var(--muted)}
.seg-in button[aria-pressed="true"]{background:var(--sun);color:var(--on-sun);font-weight:700;box-shadow:0 2px 0 var(--sun-deep)}
.pack-top{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pct{font-family:var(--f-display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.pct small{font-size:20px}
.pack-sub{display:grid;gap:4px;font-size:13px;color:var(--muted);padding-bottom:4px}
.must-left{display:inline-flex;align-items:center;gap:4px;background:var(--heart-soft);color:var(--heart);border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px;width:max-content}
.must-left.ok{background:var(--sky-soft);color:var(--sky)}
.track{position:relative;height:16px;border-radius:999px;background:var(--bg);margin:14px 14px 4px}
.track>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:repeating-linear-gradient(-45deg,var(--grass) 0 8px,var(--grass-deep) 8px 16px);transition:width .4s}
.track .face{position:absolute;top:50%;width:40px;height:40px;transform:translate(-50%,-56%);transition:left .4s;filter:drop-shadow(0 2px 2px var(--shadow))}
.track .flag{position:absolute;right:-10px;top:-14px;width:22px;height:30px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.yay{display:flex;align-items:center;gap:12px;background:var(--sky-soft);border-radius:16px;padding:8px 12px;font-family:var(--f-display);font-size:18px;color:var(--sky)}
.yay svg{width:92px;height:auto;aspect-ratio:200/168;flex:none}

/* categories */
.note-top{font-size:13px;color:var(--muted);background:var(--surface);border-radius:14px;padding:10px 14px;margin-top:16px}
.cats{display:grid;gap:18px;margin-top:20px}
.cat-h{display:flex;align-items:center;gap:10px;margin:0 4px 8px}
.cat-h h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;min-width:0;flex:1}
.cat-h input{flex:1;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;font-size:16px;font-family:var(--f-display)}
.cico{flex:none;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff;border:3px solid var(--surface);box-shadow:0 3px 0 var(--shadow);transform:rotate(-4deg)}
.cico svg{width:20px;height:20px}
.k0{background:var(--c1)}.k1{background:var(--c2)}.k2{background:var(--c3)}.k3{background:var(--c4)}.k4{background:var(--c5)}
.cnt{font-size:13px;font-weight:700;color:var(--muted);background:var(--surface);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--line)}
.cnt.done{background:var(--grass);color:#fff;box-shadow:0 2px 0 var(--grass-deep)}
ul.items{list-style:none;margin:0;padding:4px 0;overflow:hidden}
li.item{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:52px;border-top:2px dotted var(--line)}
li.item:first-child{border-top:0}
li.tap{cursor:pointer}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2.5px dashed var(--line);background:transparent;display:grid;place-items:center;padding:0}
.chk svg{width:20px;height:20px;opacity:0;fill:var(--heart)}
li.packed .chk{border:0;background:var(--heart-soft)}
li.packed .chk svg{opacity:1}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
li.pop .chk svg{animation:pop .32s ease-out}
.nmw{flex:1;min-width:0;display:grid}
.nm{overflow-wrap:anywhere}
.nt{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
li.packed .nm{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--heart)}
.tag{flex:none;font-size:12px;border-radius:999px;padding:1px 8px;font-weight:700}
.tag.must{background:var(--heart);color:#fff}
.tag.win{background:var(--sky-soft);color:var(--sky)}
.tag.sum{background:color-mix(in srgb,var(--sun) 30%,transparent);color:var(--sun-deep)}
.tag.off{background:var(--bg);color:var(--muted);font-weight:500}
li.off{opacity:.5}
li.off .chk{border-style:dotted}
.quick{border:2px dashed var(--line);background:none;color:var(--sky);font-size:14px;font-weight:700;padding:5px 14px;margin:6px 14px 8px;border-radius:999px;display:inline-flex}
.addrow{display:flex;gap:8px;padding:10px 14px;border-top:2px dotted var(--line)}
.addrow input,.ein{flex:1;min-width:0;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:7px 10px;font-size:16px}
li.edit{display:grid;gap:8px;padding:12px 14px;border-top:2px dotted var(--line)}
li.edit:first-child{border-top:0}
.erow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.erow .ein{flex:1 1 160px}
.ein.small{font-size:14px;padding:5px 10px;background:transparent;border-style:dashed}
.chipb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:500;box-shadow:0 2px 0 var(--line)}
.chipb.on-must{background:var(--heart);border-color:var(--heart);color:#fff;box-shadow:0 2px 0 color-mix(in srgb,var(--heart) 60%,#000)}
.chipb.on-win{background:var(--sky-soft);border-color:var(--sky);color:var(--sky)}
.chipb.on-sum{background:color-mix(in srgb,var(--sun) 35%,var(--surface));border-color:var(--sun-deep);color:var(--on-sun)}
.chipb.on-skip{background:var(--bg);border-style:dashed}
.chipb.del{color:var(--danger);margin-left:auto}
.cat-actions{display:flex;justify-content:flex-end;margin-top:8px}

/* trips */
.stats{margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px 12px 12px;border-radius:18px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat:nth-child(1) b{color:var(--sky)}.stat:nth-child(2) b{color:var(--c3)}.stat:nth-child(3) b{color:var(--grass-deep)}
.stat span{font-size:12px;color:var(--muted)}
.newtrip{width:100%;justify-content:center;margin-top:14px;padding:12px;font-size:18px;font-family:var(--f-display)}
.year{display:flex;align-items:center;gap:10px;margin:26px 4px 10px;font-family:var(--f-display);font-size:17px}
.year b{font-weight:400;background:var(--sun);color:var(--on-sun);border-radius:999px;padding:1px 12px;box-shadow:0 2px 0 var(--sun-deep)}
.year::after{content:"";flex:1;border-top:2px dotted var(--line)}
.trips{display:grid;gap:12px}
.trip{display:flex;gap:12px;align-items:center;padding:12px;text-align:left;width:100%;border:0;color:inherit}
.tdate{flex:none;width:60px;height:66px;border-radius:16px;background:var(--sky-soft);color:var(--sky);display:grid;place-content:center;text-align:center;line-height:1.1}
.tdate b{font-family:var(--f-display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.tdate small{font-size:11px;font-weight:700}
.tinfo{flex:1;min-width:0;display:grid;gap:2px}
.tinfo strong{font-size:16px;overflow-wrap:anywhere}
.tinfo span{font-size:13px;color:var(--muted)}
.hearts{color:var(--heart)}
.tcover{flex:none;width:74px;height:74px;border-radius:14px;object-fit:cover;background:var(--sky-soft);border:3px solid var(--surface);box-shadow:0 3px 8px var(--shadow);transform:rotate(3deg)}
.empty{padding:22px 18px;text-align:center;color:var(--muted);margin-top:16px}
.empty svg{width:150px;height:auto;aspect-ratio:200/168}
.empty p{margin:4px 0}
.empty svg.wide{width:100%;max-width:320px;aspect-ratio:400/176}

/* sheets */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;align-items:center;gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 3px 0 var(--line)}
.sheet-bar h3{flex:1;margin:0;font-family:var(--f-display);font-weight:400;font-size:19px;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.field{display:grid;gap:6px}
.field>label,.field>.lbl{font-size:13px;color:var(--muted);font-weight:700}
.field input,.field textarea,.field select{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;font-size:16px;width:100%;min-width:0}
.field textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}
.rate{display:flex;gap:2px}
.rate button{border:0;background:none;padding:2px;line-height:0}
.rate svg{width:28px;height:28px;fill:var(--line)}
.rate button.on svg{fill:var(--heart)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;background:var(--sky-soft);border:3px solid var(--surface);box-shadow:0 3px 8px var(--shadow);padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1}
.ph.up{display:grid;place-items:center;font-size:12px;color:var(--muted)}
.addph{aspect-ratio:1;border:2.5px dashed var(--sky);border-radius:14px;display:grid;place-content:center;text-align:center;color:var(--sky);font-size:13px;font-weight:700;background:var(--sky-soft)}
.addph b{font-size:28px;font-weight:400;line-height:1}
.hint{font-size:13px;color:var(--muted)}
.dhero h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:2px 0 0;text-wrap:balance}
.dmeta{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--muted);box-shadow:0 2px 0 var(--line)}
.chip.b{background:var(--sky-soft);color:var(--sky);box-shadow:none;font-weight:700}
.box{padding:14px 16px}
.box h4{margin:0 0 6px;font-size:13px;color:var(--muted)}
.dnotes{white-space:pre-wrap;overflow-wrap:anywhere}
.forgot{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.forgot li{display:flex;align-items:center;gap:8px}
.forgot li span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
.danger-zone{display:flex;justify-content:center;margin-top:6px}
.copybox{width:100%;min-height:260px;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);font-size:15px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:40;background:#000;display:grid;place-items:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:50%;width:44px;height:44px;font-size:20px}
.lb .c{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}
.lb .p{left:calc(10px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}
.lb .n{right:calc(10px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}
.lb .i{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#ddd;font-size:13px}

/* floating tab bar */
nav.tabs{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 24px));background:var(--surface);border-radius:999px;padding:6px;display:flex;gap:4px;box-shadow:0 4px 0 var(--line),0 10px 26px var(--shadow)}
nav.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:8px 6px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{background:var(--sun);color:var(--on-sun);box-shadow:0 3px 0 var(--sun-deep)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;display:flex;gap:12px;align-items:center;font-size:14px;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--sun);font-weight:700;padding:0}
.banner{background:var(--heart-soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:13px;margin-top:12px}
.loading{color:var(--muted);text-align:center;padding:50px 0}
.mseg{display:flex;background:var(--surface);border-radius:999px;padding:5px;gap:4px;margin-top:16px;box-shadow:0 4px 0 var(--line)}
.mseg button{flex:1;border:0;background:none;border-radius:999px;padding:9px 6px;font-size:15px;font-weight:700;color:var(--muted)}
.mseg button[aria-pressed="true"]{background:var(--sky);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--sky) 65%,#000)}
.day{display:flex;align-items:center;gap:10px;margin:22px 4px 10px;font-family:var(--f-display);font-size:17px}
.day b{font-weight:400;background:var(--c3);color:#fff;border-radius:999px;padding:1px 14px;box-shadow:0 2px 0 color-mix(in srgb,var(--c3) 65%,#000)}
.day::after{content:"";flex:1;border-top:2px dotted var(--line)}
.meals{display:grid;gap:10px}
.meal{display:flex;gap:12px;align-items:flex-start;padding:14px;text-align:left;width:100%;border:0;color:inherit}
.slot{flex:none;font-size:13px;font-weight:700;border-radius:12px;padding:6px 0;width:52px;text-align:center}
.s0{background:color-mix(in srgb,var(--sun) 35%,var(--surface));color:var(--on-sun)}.s1{background:var(--sky-soft);color:var(--sky)}.s2{background:var(--heart-soft);color:var(--heart)}.s3{background:color-mix(in srgb,var(--c5) 22%,var(--surface));color:var(--c5)}
.mbody{flex:1;min-width:0;display:grid;gap:6px}
.mbody strong{font-family:var(--f-display);font-weight:400;font-size:18px;overflow-wrap:anywhere}
.ings{display:flex;flex-wrap:wrap;gap:5px}
.ing{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--bg);color:var(--muted)}
.ing.ok{background:var(--heart-soft);color:var(--heart);font-weight:700}
.sec-t{font-family:var(--f-display);font-size:18px;margin:22px 4px 8px;display:flex;align-items:center;gap:8px}
.slotpick{display:flex;gap:6px;flex-wrap:wrap}
.slotpick button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-weight:700;color:var(--muted);box-shadow:0 2px 0 var(--line)}
.slotpick button[aria-pressed="true"]{background:var(--sun);border-color:var(--sun-deep);color:var(--on-sun);box-shadow:0 2px 0 var(--sun-deep)}
.xbtn{flex:none;border:0;background:var(--bg);color:var(--muted);border-radius:50%;width:28px;height:28px;font-size:13px}
.wx-places{display:flex;gap:8px;overflow-x:auto;margin-top:16px;padding:2px 2px 6px}
.wx-place{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;color:var(--muted);box-shadow:0 2px 0 var(--line)}
.wx-place.on{background:var(--sky);border-color:var(--sky);color:#fff;box-shadow:0 2px 0 color-mix(in srgb,var(--sky) 65%,#000)}
.wx-place.add{border-style:dashed;color:var(--sky);box-shadow:none}
.wx-trip{margin-top:10px;padding:14px;display:grid;gap:10px}
.verdict{border-radius:16px;padding:12px 14px;display:grid;gap:2px}
.verdict b{font-family:var(--f-display);font-weight:400;font-size:22px}
.verdict span{font-size:13px}
.verdict.v0{background:color-mix(in srgb,var(--grass) 30%,var(--surface));color:var(--ink)}
.verdict.v1{background:color-mix(in srgb,var(--sun) 35%,var(--surface));color:var(--ink)}
.verdict.v2{background:var(--heart);color:#fff}
.wx-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 4px 8px;font-family:var(--f-display);font-size:17px}
.wx-list{padding:0}
.wx-day{display:flex;gap:12px;padding:10px 14px;border-top:2px dotted var(--line);align-items:flex-start}
.wx-day:first-child{border-top:0}
.wx-day.trip{background:var(--sky-soft)}
.wx-day.l2{box-shadow:inset 4px 0 0 var(--heart)}.wx-day.l1{box-shadow:inset 4px 0 0 var(--sun-deep)}
.wx-date{flex:none;width:44px;display:grid;line-height:1.15;font-variant-numeric:tabular-nums}
.wx-date b{font-size:16px}.wx-date small{font-size:12px;color:var(--muted)}
.wx-main{flex:1;min-width:0;display:grid;gap:3px}
.wx-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wx-code{font-weight:700;font-size:14px;border-radius:999px;padding:1px 9px}
.wx-code.sunny{background:color-mix(in srgb,var(--sun) 35%,transparent);color:var(--on-sun)}
.wx-code.overcast{background:var(--bg);color:var(--muted)}
.wx-code.rain{background:var(--sky-soft);color:var(--sky)}
.wx-code.storm{background:var(--heart-soft);color:var(--heart)}
.wx-t{font-variant-numeric:tabular-nums;font-weight:700}
.wx-nums{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wx-risk{font-size:12px;color:var(--heart);font-weight:700}
.wx-day.l0 .wx-risk{color:var(--sky)}
.wx-links{margin-top:22px;padding:16px;display:grid;gap:10px}
.wx-links h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px;display:flex;align-items:center;gap:8px}
.wx-links p{margin:0;font-size:13px;color:var(--muted)}
a.btn{text-decoration:none;color:inherit}
a.btn.sun{color:var(--on-sun)}
nav.tabs button{font-size:13px;gap:4px}
@media (max-width:380px){nav.tabs button svg{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- 本機儲存（IndexedDB）＋ Google 同步 ---------- */
const LDB=(()=>{let p;
  const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('camp-notebook',1);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('docs'))d.createObjectStore('docs');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos');};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const run=(st,mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction(st,mode);const o=fn(t.objectStore(st));
    t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}));
  return {
    get:(st,k)=>run(st,'readonly',s=>s.get(k)),
    put:(st,k,v)=>run(st,'readwrite',s=>s.put(v,k)),
    del:(st,k)=>run(st,'readwrite',s=>s.delete(k)),
    clear:st=>run(st,'readwrite',s=>s.clear()),
    all:st=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction(st);const s=t.objectStore(st);const kr=s.getAllKeys(),vr=s.getAll();
      t.oncomplete=()=>res(kr.result.map((k,n)=>[k,vr.result[n]]));t.onerror=()=>rej(t.error);}))
  };})();

/* 兩個人同時修改時，以項目為單位合併：你勾的和他勾的都會留下 */
const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function merge3(b,m,t){
  if(same(m,t))return m;if(same(b,m))return t;if(same(b,t))return m;
  if(isObj(m)&&isObj(t)){const bo=isObj(b)?b:{},o={};
    for(const k of new Set([...Object.keys(m),...Object.keys(t)])){const v=merge3(bo[k],m[k],t[k]);if(v!==undefined)o[k]=v;}return o;}
  if(Array.isArray(m)&&Array.isArray(t)&&[...m,...t].every(x=>isObj(x)&&x.id)){
    const B=new Map((Array.isArray(b)?b:[]).filter(x=>isObj(x)&&x.id).map(x=>[x.id,x])),M=new Map(m.map(x=>[x.id,x])),T=new Map(t.map(x=>[x.id,x]));
    const out=[],seen=new Set();
    const add=id=>{if(seen.has(id))return;seen.add(id);const v=merge3(B.get(id),M.get(id),T.get(id));if(v!==undefined)out.push(v);};
    t.forEach(x=>add(x.id));m.forEach(x=>add(x.id));return out;}
  return m;
}

async function api(action,payload,timeout){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),timeout||25000);
  try{const r=await fetch(SY.cfg.url,{method:'POST',body:JSON.stringify(Object.assign({action,key:SY.cfg.key},payload||{})),signal:ctl.signal});
    const j=await r.json();if(!j.ok){const e=new Error(j.error||'error');e.code=j.error;throw e;}return j;}
  finally{clearTimeout(to);}
}
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});
async function uploadDrive(b){const j=await api('photo',{mime:b.type||'image/jpeg',name:'camp-'+newId()+'.jpg',b64:await blobToB64(b)},90000);return 'd_'+j.id;}

const localAssets={
  upload:async b=>{
    if(SY.cfg&&navigator.onLine){try{return {id:await uploadDrive(b)};}catch(e){if(e.code==='key')throw e;}}
    const id='l_'+newId();await LDB.put('photos',id,b);URLS.set(id,URL.createObjectURL(b));return {id};},
  delete:async id=>{
    if(isDrive(id)){if(SY.cfg)api('delphoto',{id:id.slice(2)}).catch(()=>{});return {deleted:true};}
    await LDB.del('photos',id);const u=URLS.get(id);if(u)URL.revokeObjectURL(u);URLS.delete(id);return {deleted:true};}
};

/* 把只存在手機裡的照片補傳到雲端硬碟 */
async function uploadPendingPhotos(){
  for(const t of [...S.trips]){
    const ph=t.photos||[];if(!ph.some(id=>!isDrive(id)))continue;
    const out=[];let changed=false;
    for(const id of ph){
      if(isDrive(id)){out.push(id);continue;}
      const b=await LDB.get('photos',id);if(!b){changed=true;continue;}
      const nid=await uploadDrive(b);out.push(nid);changed=true;
      await LDB.del('photos',id).catch(()=>{});const u=URLS.get(id);if(u)URL.revokeObjectURL(u);URLS.delete(id);
    }
    if(changed){const cur=S.trips.find(x=>x.id===t.id);if(cur){cur.photos=out;const d=getLocal('trips/'+t.id);setLocal('trips/'+t.id,clone(d));markDirty('trips/'+t.id);}}
  }
}

function applyRemote(docs,first){
  let changed=false;
  for(const [k,r] of Object.entries(docs)){
    if(k.startsWith('meta/'))continue;
    const m=SY.meta[k]||{v:0,b:null};
    if(r.v<=m.v&&!first)continue;
    const theirs=r.d===null?null:r.d;
    if(!m.dirty||first){setLocal(k,clone(theirs));SY.meta[k]={v:r.v,b:theirs};}
    else{const mine=getLocal(k);const merged=mine===undefined&&theirs===null?null:merge3(m.b===null?undefined:m.b,mine,theirs===null?undefined:theirs);
      setLocal(k,merged===undefined?null:clone(merged));SY.meta[k]={v:r.v,b:theirs,dirty:true};}
    changed=true;
  }
  if(changed)saveMeta();
  return changed;
}

async function syncNow(){
  if(!SY.cfg)return;
  if(SY.busy){SY.again=true;return;}
  if(!navigator.onLine){SY.status='offline';paintSync();return;}
  SY.busy=true;SY.status='syncing';paintSync();
  try{
    const first=SY.first;
    const pull=await api('pull');
    const changed=applyRemote(pull.docs||{},first);
    if(first){SY.first=false;SY.cfg.first=false;await LDB.put('docs','meta/sync',SY.cfg);
      for(const k of docKeys())if(!(k in (pull.docs||{})))markDirty(k);}
    if(changed)render();
    await uploadPendingPhotos();
    for(let round=0;round<4;round++){
      const dirty=Object.entries(SY.meta).filter(([,m])=>m.dirty).map(([k])=>k);
      if(!dirty.length)break;
      for(const k of dirty){
        const m=SY.meta[k];const d=getLocal(k);const sent=d===undefined?null:clone(d);
        const r=await api('put',{doc:k,data:sent,base:m.v});
        if(r.conflict){applyRemote({[k]:{v:r.v,d:r.d}},false);render();continue;}
        const now=getLocal(k);
        SY.meta[k]={v:r.v,b:sent,dirty:!same(now===undefined?null:now,sent)};
      }
      saveMeta();
    }
    SY.status='ok';SY.last=new Date();
  }catch(e){SY.status=e&&e.code==='key'?'badkey':(navigator.onLine?'error':'offline');}
  finally{SY.busy=false;paintSync();if(SY.again){SY.again=false;setTimeout(syncNow,300);}}
}
function syncLabel(){
  if(!SY.cfg)return '';
  return {syncing:'同步中…',ok:'已同步',offline:'離線中，有網路時會自動同步',error:'同步失敗，稍後會再試',badkey:'同步網址需要重新設定',off:''}[SY.status]||'';
}
function paintSync(){
  const el=document.getElementById('syncchip');if(el){el.textContent=syncLabel();el.className='syncchip s-'+SY.status;el.hidden=!SY.cfg;}
  const sc=document.getElementById('syncstate');if(sc)sc.textContent=syncDetail();
}
function syncDetail(){
  if(!SY.cfg)return '';const t=SY.last;
  return syncLabel()+(t?`（最後同步 ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}）`:'');
}
setInterval(()=>{if(SY.cfg&&document.visibilityState==='visible')syncNow();},20000);

function parseSyncCode(raw,key){
  raw=String(raw||'').trim();let url=raw,k=String(key||'').trim();
  const h=raw.indexOf('#');if(h>0){url=raw.slice(0,h);if(!k)k=raw.slice(h+1);}
  return {url:url.trim(),key:k.trim()};
}
async function connectSync(raw,key){
  const c=parseSyncCode(raw,key);
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(c.url))throw Object.assign(new Error(),{msg:'同步網址不對，應該是 https://script.google.com/ 開頭、/exec 結尾。'});
  const prev=SY.cfg;SY.cfg={url:c.url,key:c.key||'',first:true};
  try{await api('ping');}catch(e){SY.cfg=prev;throw Object.assign(new Error(),{msg:e.code==='key'?'這個同步網址還在用舊版程式。請到 Apps Script 重新執行 setup，再部署新版本。':'連不到同步網址。請確認網址正確，而且部署時「誰可以存取」選的是「所有人」。'});}
  SY.first=true;SY.meta={};await LDB.put('docs','meta/sync',SY.cfg);saveMeta();
  await syncNow();
}
async function disconnectSync(){SY.cfg=null;SY.status='off';SY.meta={};await LDB.del('docs','meta/sync');await LDB.del('docs','meta/syncstate');render();}

/* ---------- 備份／還原 ---------- */
const blobToData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
async function exportBackup(){
  toast('正在準備備份檔…');
  const docs=(await LDB.all('docs')).filter(([k])=>!k.startsWith('meta/'));
  const photos={};for(const [k,b] of await LDB.all('photos'))photos[k]=await blobToData(b);
  const data={app:'camp-notebook',version:1,exportedAt:new Date().toISOString(),docs:Object.fromEntries(docs),photos};
  const name=`露營手帳備份-${today()}.json`;
  const file=new File([JSON.stringify(data)],name,{type:'application/json'});
  let done=false;
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'露營手帳備份'});done=true;}}
  catch(e){if(e&&e.name==='AbortError')return;}
  if(!done){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
  META.lastBackup=new Date().toISOString();await LDB.put('docs','meta/main',META);
  toast('備份檔已產生，記得存到雲端硬碟或傳給自己');render();
}
$('#restorepick').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const data=JSON.parse(await f.text());
    if(!data||data.app!=='camp-notebook'||!data.docs)throw 0;
    const trips=Object.keys(data.docs).filter(k=>k.startsWith('trips/')).length;
    openSheet({kind:'restore',data,trips,photos:Object.keys(data.photos||{}).length});
  }catch(err){toast('這不是露營手帳的備份檔');}
});
async function doRestore(data){
  toast('還原中…');
  const keep=await LDB.get('docs','meta/sync');await LDB.clear('docs');await LDB.clear('photos');if(keep)await LDB.put('docs','meta/sync',Object.assign(keep,{first:false}));
  for(const [k,v] of Object.entries(data.docs))await LDB.put('docs',k,v);
  for(const [k,u] of Object.entries(data.photos||{})){const b=await (await fetch(u)).blob();await LDB.put('photos',k,b);}
  await LDB.put('docs','meta/main',{lastBackup:data.exportedAt});
  location.reload();
}

const SLOTS=['早餐','中餐','晚餐','點心'];
const splitIngs=t=>String(t||'').split(/[\n、，,]+/).map(x=>x.trim()).filter(Boolean);
const mealLabel=m=>`第${m.day}天${SLOTS[m.slot]||''}`;
const sortedMeals=()=>[...S.menu.meals].sort((a,b)=>(a.day-b.day)||(a.slot-b.slot));
function prepItems(){
  const map=new Map();

function fmtDate(d,withYear){

  const [y,m,dd]=d.split('-').map(Number);const wd=new Date(y,m-1,dd).getDay();

function rangeText(t,withYear){const n=+t.nights||0;return n>0?`${fmtDate(t.date,withYear)} – ${fmtDate(endDate(t.date,n))}`:fmtDate(t.date,withYear);}

const WX={data:{},loading:false,err:'',search:null,searching:false};
function normWx(){S.wx=S.wx||{};S.wx.places=S.wx.places||[];if(!S.wx.days)S.wx.days=2;}
const saveWx=()=>{if(S.db)S.db.doc('weather/main').set(clone(S.wx));};
const WCODE=c=>c===0?'晴':c<=2?'晴時多雲':c===3?'陰天':c<=48?'有霧':c<=57?'毛毛雨':c<=63?'下雨':c<=67?'大雨':c<=77?'下雪':c<=81?'陣雨':c===82?'豪大陣雨':'雷雨';
const WCLS=c=>c<=2?'sunny':c<=48?'overcast':c>=95?'storm':'rain';
const BEAU=[1,6,12,20,29,39,50,62,75,89,103,118];
const beaufort=k=>{let b=0;while(b<BEAU.length&&k>=BEAU[b])b++;return b;};
function dayRisk(d){
  const r=[];let lv=0;
  const g=d.gust,b=beaufort(g);
  if(b>=8){r.push(`陣風 ${b} 級，帳篷天幕危險`);lv=2;}else if(b>=6){r.push(`陣風 ${b} 級，要加強營繩營釘`);lv=Math.max(lv,1);}
  if(d.rain>=80){r.push(`雨量 ${Math.round(d.rain)} 毫米，豪雨`);lv=2;}else if(d.rain>=40){r.push(`雨量 ${Math.round(d.rain)} 毫米，大雨`);lv=Math.max(lv,1);}
  else if(d.pop>=70){r.push('很可能下雨，帶雨具和地布');lv=Math.max(lv,1);}
  if(d.code>=95){r.push('可能有雷雨');lv=Math.max(lv,1);}
  if(d.tmin<=10){r.push(`最低 ${Math.round(d.tmin)}°C，帶暖爐和電熱毯`);}
  return {lv,r};
}
async function geoSearch(q){
  q=q.trim();
  const m=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,，\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if(m)return [{name:`座標 ${(+m[1]).toFixed(3)}, ${(+m[2]).toFixed(3)}`,lat:+m[1],lon:+m[2],sub:'自訂座標'}];
  const tries=[q,q+'鄉',q+'鎮',q+'區',q+'市',q.replace(/[鄉鎮區市縣]$/,'')].filter((v,i,a)=>v.length>=2&&a.indexOf(v)===i);
  const out=[],seen=new Set();
  for(const t of tries){
    try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(t)}&count=8&language=zh&format=json`);
      const j=await r.json();
      for(const x of j.results||[]){const k=x.latitude.toFixed(2)+','+x.longitude.toFixed(2);if(seen.has(k))continue;seen.add(k);
        out.push({name:x.name,lat:x.latitude,lon:x.longitude,sub:[x.admin1,x.admin2,x.country].filter(Boolean).join('・'),tw:x.country_code==='TW'});}}
    catch(e){}
    if(out.some(x=>x.tw))break;
  }
  return out.sort((a,b)=>(b.tw?1:0)-(a.tw?1:0)).slice(0,8);
}
async function loadForecast(p,force){
  const k=p.id;const c=WX.data[k];
  if(c&&!force&&Date.now()-c.at<30*60*1000)return c;
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_gusts_10m_max,wind_speed_10m_max&timezone=Asia%2FTaipei&forecast_days=16&wind_speed_unit=kmh`;
  const j=await (await fetch(url)).json();
  if(!j.daily)throw new Error('no data');
  const D=j.daily;
  const days=D.time.map((t,i)=>({date:t,code:D.weather_code[i],tmax:D.temperature_2m_max[i],tmin:D.temperature_2m_min[i],pop:D.precipitation_probability_max[i]??0,rain:D.precipitation_sum[i]??0,gust:D.wind_gusts_10m_max[i]??0,wind:D.wind_speed_10m_max[i]??0}));
  const v={at:Date.now(),days};WX.data[k]=v;
  try{LDB.put('docs','meta/wx-'+k,v);}catch(e){}
  return v;
}

}

  const el=$('#sheet');

    el.innerHTML=`<div class="sheet-bar"><button class="btn ghost" data-act="close">‹ 返回</button><h3>未打包清單</h3><span style="width:64px"></span></div>

    setTimeout(()=>{const t=$('#copybox');t&&t.select();},50);

  }
  if(sheetState.kind==='detail'){
    const t=S.trips.find(x=>x.id===sheetState.id);
    if(!t){el.innerHTML='<div class="sheet-bar"><button class="btn ghost" data-act="close">‹ 返回</button><h3>露營紀錄</h3></div><div class="loading">讀取中…</div>';return;}
    const ph=t.photos||[], fg=forgotLines(t);
    el.innerHTML=`<div class="sheet-bar"><button class="btn ghost" data-act="close">‹ 返回</button><h3>${esc(t.place||'露營紀錄')}</h3>${S.canWrite?'<button class="btn sun" data-act="editTrip">編輯</button>':'<span style="width:64px"></span>'}</div>
    <div class="sheet-body">
      <div class="dhero"><span class="hint">${esc(rangeText(t,true))}</span><h2>${esc(t.place||'未命名營地')}</h2></div>
      <div class="dmeta">
        ${t.area?`<span class="chip b">${esc(t.area)}</span>`:''}
        <span class="chip">${+t.nights?`${+t.nights} 晚`:'當日來回'}</span>
        ${t.site?`<span class="chip">營位 ${esc(t.site)}</span>`:''}
        ${t.weather?`<span class="chip">${esc(t.weather)}</span>`:''}
        ${t.rating?`<span class="chip hearts">${hearts(t.rating)}</span>`:''}
      </div>
      ${ph.length?`<div class="photos">${ph.map((id,k)=>`<button class="ph" data-act="lb" data-k="${k}" aria-label="看大圖"><img src="${blob(id)}" alt="" loading="lazy"></button>`).join('')}</div>`:'<p class="hint">這次還沒有照片。</p>'}
      ${t.notes?`<div class="card box"><h4>心得筆記</h4><div class="dnotes">${esc(t.notes)}</div></div>`:''}
      ${fg.length?`<div class="card box"><h4>這次忘了帶</h4><ul class="forgot">${fg.map((s,k)=>`<li><span>${esc(s)}</span>${inGear(s)?'<span class="tag off">已在清單</span>':S.canWrite?`<button class="chipb" data-act="addForgot" data-k="${k}">＋ 加進清單</button>`:''}</li>`).join('')}</ul></div>`:''}
      ${S.canWrite?`<div class="danger-zone"><button class="btn ${S.confirm==='trip'?'danger':'ghost'}" data-act="delTrip">${S.confirm==='trip'?'確定刪除這筆紀錄和照片？':'刪除這筆紀錄'}</button></div>`:''}
    </div>`;
    return;
  }
  if(sheetState.kind==='wxadd'){renderWxSheet(el);return;}
  if(sheetState.kind==='sync'){
    const f=sheetState;
    el.innerHTML=`<div class="sheet-bar"><button class="btn ghost" data-act="close">取消</button><h3>開啟同步</h3><span style="width:64px"></span></div>
    <form class="sheet-body" autocomplete="off" onsubmit="return false">
      <p class="hint">貼上 Google Apps Script 部署後的「網頁應用程式網址」。家人加入時，貼上你傳給他的同步網址就好。</p>
      <div class="field"><label for="s-url">同步網址</label><textarea id="s-url" style="min-height:100px;font-size:14px" placeholder="https://script.google.com/macros/s/……/exec">${esc(f.url||'')}</textarea></div>
      ${f.err?`<div class="banner">${esc(f.err)}</div>`:''}
      <button type="button" class="btn sun newtrip" data-act="doConnect" ${f.busy?'disabled':''}>${f.busy?'連線中…':'連線'}</button>
      <p class="hint">連線後，如果雲端已經有資料（例如家人先設定好了），這支手機會改成顯示雲端那一份。</p>

  if(sheetState.kind==='restore'){

    <div class="sheet-body"><div class="card box"><h4>備份內容</h4><div>備份日期：${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}</div><div>露營紀錄 ${r.trips} 筆、照片 ${r.photos} 張</div></div>
    <p class="hint">還原後，這支手機目前的清單、菜單和紀錄會被備份內容取代。</p>
    <button class="btn danger newtrip" data-act="doRestore">確定還原</button></div>`;

  if(sheetState.kind==='meal'){
    const m=sheetState.m;
    el.innerHTML=`<div class="sheet-bar"><button class="btn ghost" data-act="close">取消</button><h3>${m.id?'編輯這一餐':'新增一餐'}</h3><button class="btn sun" data-act="saveMeal">儲存</button></div>
    <form class="sheet-body" autocomplete="off">
      <div class="field"><label for="m-day">第幾天</label><select id="m-day">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${m.day===n?'selected':''}>第 ${n} 天</option>`).join('')}</select></div>
      <div class="field"><span class="lbl">哪一餐</span><div class="slotpick">${SLOTS.map((l,k)=>`<button type="button" data-act="pickSlot" data-k="${k}" aria-pressed="${m.slot===k}">${l}</button>`).join('')}</div></div>
      <div class="field"><label for="m-dish">要煮什麼</label><input id="m-dish" value="${esc(m.dish)}" placeholder="例如：味噌豆腐泡麵"></div>
      <div class="field"><label for="m-ings">需要的食材（一行一項，或用、分開）</label><textarea id="m-ings" placeholder="例如：&#10;味噌&#10;豆腐&#10;泡麵">${esc((m.ings||[]).join('\n'))}</textarea><span class="hint">食材會自動放進「準備清單」，同樣的食材只會出現一次。</span></div>
      ${m.id?`<div class="danger-zone"><button type="button" class="btn ${S.confirm==='meal'?'danger':'ghost'}" data-act="delMeal">${S.confirm==='meal'?'確定刪除這一餐？':'刪除這一餐'}</button></div>`:''}
    </form>`;
    return;
  }
  const f=sheetState.form, busy=f.uploading>0;
  el.innerHTML=`<div class="sheet-bar"><button class="btn ghost" data-act="cancelForm">取消</button><h3>${f.id?'編輯紀錄':'新增露營'}</h3><button class="btn sun" data-act="saveTrip" ${busy||f.saving?'disabled':''}>${f.saving?'儲存中…':'儲存'}</button></div>
  <form class="sheet-body" id="tripForm" autocomplete="off">
    <div class="two">
      <div class="field"><label for="f-date">出發日期</label><input type="date" id="f-date" value="${esc(f.date)}" required></div>
      <div class="field"><label for="f-nights">住幾晚</label><select id="f-nights">${[0,1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${+f.nights===n?'selected':''}>${n?n+' 晚':'當日來回'}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label for="f-place">營地名稱</label><input id="f-place" value="${esc(f.place)}" placeholder="例如：○○森林露營區"></div>
    <div class="two">
      <div class="field"><label for="f-area">縣市／地區</label><input id="f-area" value="${esc(f.area)}" placeholder="例如：苗栗南庄"></div>
      <div class="field"><label for="f-site">營位</label><input id="f-site" value="${esc(f.site)}" placeholder="例如：A3 雨棚區"></div>
    </div>
    <div class="two">
      <div class="field"><label for="f-weather">天氣</label><input id="f-weather" value="${esc(f.weather)}" placeholder="例如：晴、夜裡 12°C"></div>
      <div class="field"><span class="lbl">喜歡程度</span><div class="rate">${[1,2,3,4,5].map(n=>`<button type="button" class="${n<=f.rating?'on':''}" data-act="rate" data-n="${n}" aria-label="${n} 顆愛心">${HEART}</button>`).join('')}</div></div>
    </div>
    <div class="field"><span class="lbl">照片</span>
      ${S.assets?`<div class="photos">
        ${f.photos.map((id,k)=>`<div class="ph"><img src="${blob(id)}" alt=""><button type="button" class="x" data-act="rmPhoto" data-k="${k}" aria-label="移除照片">✕</button></div>`).join('')}
        ${Array.from({length:f.uploading}).map(()=>'<div class="ph up">上傳中…</div>').join('')}
        <button type="button" class="addph" data-act="pickPhoto"><b>＋</b>加照片</button></div>
        <span class="hint">照片會自動縮小再上傳，一次可選多張。</span>`
      :'<span class="hint">目前無法上傳照片（需要這個頁面的編輯權限）。</span>'}
    </div>
    <div class="field"><label for="f-notes">心得筆記</label><textarea id="f-notes" placeholder="營地環境、廁所浴室、小孩玩什麼…">${esc(f.notes)}</textarea></div>
    <div class="field"><label for="f-forgot">這次忘了帶（一行一項）</label><textarea id="f-forgot" style="min-height:80px" placeholder="例如：&#10;曬衣夾&#10;小孩的拖鞋">${esc(f.forgot)}</textarea><span class="hint">存檔後在紀錄裡可以一鍵加進裝備清單。</span></div>
  </form>`;
}
function readForm(){
  const f=sheetState.form;
  for(const k of ['date','nights','place','area','site','weather','notes','forgot']){const el=$('#f-'+k);if(el)f[k]=el.value;}
}

/* ---------- photos ---------- */
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u;});}
async function shrink(file){
  try{
    const img=await loadImg(file);
    const r=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const b=await new Promise(res=>c.toBlob(res,'image/jpeg',.82));
    if(b)return {b,type:'image/jpeg'};
  }catch(e){}
  return {b:file,type:file.type};
}
$('#filepick').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';
  if(!sheetState||sheetState.kind!=='form'||!S.assets)return;
  readForm();const f=sheetState.form;
  f.uploading+=files.length;refreshSheet();
  for(const file of files){
    try{const {b,type}=await shrink(file);const r=await S.assets.upload(b,{type});if(sheetState&&sheetState.form===f){f.photos.push(r.id);f.added.push(r.id);}}
    catch(err){toast(err&&err.code==='too_large'?'有照片太大，無法上傳':err&&err.code==='quota_or_state'?'照片空間已滿':'有照片上傳失敗');}
    f.uploading--; if(sheetState&&sheetState.form===f){readForm();refreshSheet();}
  }
});

/* ---------- lightbox / toast ---------- */
let lbList=[],lbK=0;
function showLb(){const el=$('#lb');el.innerHTML=`<img src="${blob(lbList[lbK])}" alt="">
  <button class="c" data-act="lbClose" aria-label="關閉">✕</button>
  ${lbList.length>1?'<button class="p" data-act="lbPrev" aria-label="上一張">‹</button><button class="n" data-act="lbNext" aria-label="下一張">›</button>':''}
  <div class="i">${lbK+1} / ${lbList.length}</div>`;el.hidden=false;}
let toastT;
function toast(msg,undo){const el=$('#toast');el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">復原</button>':''}`;el.hidden=false;
  toast.undo=undo;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;toast.undo=null;},undo?5000:2600);}
function setConfirm(key){S.confirm=key;clearTimeout(setConfirm.t);setConfirm.t=setTimeout(()=>{S.confirm=null;render();if(sheetState&&sheetState.kind==='detail')refreshSheet();},4000);}

function unpackedText(){
  const se=season();
  let out=[`露營還沒打包${se!=='all'?`（${SEASON[se]}）`:''}：`];
  for(const c of S.gear.categories){
    const left=c.items.filter(i=>active(i)&&!i.packed);
    if(!left.length)continue;
    out.push('',`【${c.name}】`);
    left.forEach(i=>out.push(`・${i.name}${isMust(i)?'（必帶）':''}${i.note?` — ${i.note}`:''}`));
  }
  if(out.length===1)out.push('全部打包好了！');
  return out.join('\n');
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||!b.dataset.act)return;
  const act=b.dataset.act, li=b.closest('[data-i]'), cat=b.closest('[data-c]');
  const cid=cat&&cat.dataset.c, iid=li&&li.dataset.i;
  switch(act){
    case 'tab': S.adding=null;S.tab=b.dataset.tab;S.edit=false;S.confirm=null;render();window.scrollTo(0,0);if(S.tab==='weather')refreshWx();break;
    case 'edit': S.adding=null;S.edit=!S.edit;S.confirm=null;render();break;
    case 'hidePacked': S.hidePacked=!S.hidePacked;render();break;
    case 'mustOnly': S.mustOnly=!S.mustOnly;render();break;
    case 'season': S.gear.season=b.dataset.s;render();saveGear();break;
    case 'copy':{const txt=unpackedText();
      try{await navigator.clipboard.writeText(txt);toast('已複製，可以貼到 LINE 了');}
      catch(err){openSheet({kind:'copy',text:txt});}break;}
    case 'toggle':{const {i}=findItem(cid,iid);if(!i)return;i.packed=!i.packed;S.pop=i.packed?i.id:null;render();S.pop=null;saveGear();break;}
    case 'reset':
      if(S.confirm!=='reset'){setConfirm('reset');render();return;}
      S.confirm=null;S.gear.categories.forEach(c=>c.items.forEach(i=>i.packed=false));render();saveGear();toast('已全部取消勾選');break;
    case 'must':{const {i}=findItem(cid,iid);const v=!isMust(i);i.must=v;delete i.star;render();saveGear();break;}
    case 'seasonItem':{const {i}=findItem(cid,iid);i.season=!i.season?'winter':i.season==='winter'?'summer':null;if(!i.season)delete i.season;render();saveGear();break;}
    case 'skip':{const {i}=findItem(cid,iid);i.skip=!i.skip;if(i.skip)i.packed=false;render();saveGear();break;}
    case 'delItem':{const {c,i}=findItem(cid,iid);const k=c.items.indexOf(i);c.items.splice(k,1);render();saveGear();
      toast(`已刪除「${i.name}」`,()=>{c.items.splice(k,0,i);render();saveGear();});break;}
    case 'quickAdd': S.adding=cid;render();{const n=$('#add-'+cid);n&&n.focus();}break;
    case 'addItem': addItem(cid);break;
    case 'addCat': addCat();break;
    case 'delCat':
      if(S.confirm!=='cat-'+cid){setConfirm('cat-'+cid);render();return;}
      S.confirm=null;{const k=S.gear.categories.findIndex(c=>c.id===cid);const c=S.gear.categories.splice(k,1)[0];render();saveGear();
        toast(`已刪除分類「${c.name}」`,()=>{S.gear.categories.splice(k,0,c);render();saveGear();});}break;
    case 'newTrip':{const d=new Date();
      openSheet({kind:'form',form:{id:null,date:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,nights:1,place:'',area:'',site:'',weather:'',notes:'',forgot:'',rating:0,photos:[],added:[],removed:[],uploading:0}});break;}
    case 'openTrip': S.confirm=null;openSheet({kind:'detail',id:b.dataset.id});break;
    case 'close': closeSheet();break;
    case 'editTrip':{const t=S.trips.find(x=>x.id===sheetState.id);
      openSheet({kind:'form',back:t.id,form:{id:t.id,date:t.date||'',nights:+t.nights||0,place:t.place||'',area:t.area||'',site:t.site||'',weather:t.weather||'',notes:t.notes||'',forgot:t.forgot||'',rating:t.rating||0,photos:[...(t.photos||[])],added:[],removed:[],uploading:0}});break;}
    case 'cancelForm':{const f=sheetState.form;
      if(S.assets)f.added.forEach(id=>S.assets.delete(id).catch(()=>{}));
      sheetState.back?openSheet({kind:'detail',id:sheetState.back}):closeSheet();break;}
    case 'rate': readForm();sheetState.form.rating=+b.dataset.n===sheetState.form.rating?0:+b.dataset.n;refreshSheet();break;
    case 'pickPhoto': readForm();$('#filepick').click();break;
    case 'rmPhoto':{readForm();const f=sheetState.form;const id=f.photos.splice(+b.dataset.k,1)[0];f.removed.push(id);refreshSheet();break;}
    case 'saveTrip': saveTrip();break;
    case 'openSync': openSheet({kind:'sync'});break;
    case 'doConnect':{const f=sheetState;f.url=$('#s-url').value;f.key='';f.busy=true;f.err='';refreshSheet();
      try{await connectSync(f.url,f.key);closeSheet();render();toast('已開啟同步');}
      catch(err){f.busy=false;f.err=err.msg||'連線失敗，請再試一次';refreshSheet();}
      break;}
    case 'copyFamily':{const t=SY.cfg.key?SY.cfg.url+'#'+SY.cfg.key:SY.cfg.url;try{await navigator.clipboard.writeText(t);toast('已複製，用 LINE 傳給家人');}catch(err){openSheet({kind:'copy',text:t});}break;}
    case 'syncNow': syncNow();break;
    case 'unsync':
      if(S.confirm!=='unsync'){setConfirm('unsync');render();return;}
      S.confirm=null;await disconnectSync();toast('這支手機已關閉同步，資料仍留在手機裡');break;
    case 'backup': exportBackup().catch(()=>toast('備份失敗，請再試一次'));break;
    case 'restore': $('#restorepick').click();break;
    case 'doRestore': doRestore(sheetState.data).catch(()=>toast('還原失敗，請再試一次'));break;
    case 'wxSel': S.wx.sel=b.dataset.id;saveWx();render();refreshWx();break;
    case 'wxAdd': openSheet({kind:'wxadd'});setTimeout(()=>{const q=$('#wx-q');q&&q.focus();},80);break;
    case 'wxSearch': wxSearch();break;
    case 'wxPick': sheetState.pick=clone(sheetState.res[+b.dataset.k]);refreshSheet();break;
    case 'wxSave':{const p=sheetState.pick;const nm=($('#wx-name').value||p.name).trim();normWx();
      const id=newId();S.wx.places.push({id,name:nm,lat:+p.lat.toFixed(4),lon:+p.lon.toFixed(4)});S.wx.sel=id;saveWx();closeSheet();render();refreshWx(true);break;}
    case 'wxRefresh': refreshWx(true);break;
    case 'wxDel':
      if(S.confirm!=='wxdel'){setConfirm('wxdel');render();return;}
      S.confirm=null;{const p=wxPlace();S.wx.places=S.wx.places.filter(x=>x.id!==p.id);S.wx.sel=S.wx.places[0]&&S.wx.places[0].id;saveWx();render();refreshWx();}break;
    case 'menuView': S.menuView=b.dataset.v;S.adding=null;render();break;
    case 'prepLeft': S.prepLeft=!S.prepLeft;render();break;
    case 'prepToggle':{const n=b.dataset.n;const v=!S.menu.ready[n];if(v)S.menu.ready[n]=true;else delete S.menu.ready[n];S.pop=v?'p:'+n:null;render();S.pop=null;saveMenu();break;}
    case 'prepReset':
      if(S.confirm!=='prepReset'){setConfirm('prepReset');render();return;}
      S.confirm=null;S.menu.ready={};render();saveMenu();toast('已全部取消勾選');break;
    case 'copyPrep':{const txt=prepText();try{await navigator.clipboard.writeText(txt);toast('已複製，可以貼到 LINE 了');}catch(err){openSheet({kind:'copy',text:txt});}break;}
    case 'quickExtra': S.adding='extra';render();{const n=$('#add-extra');n&&n.focus();}break;
    case 'addExtra': addExtra();break;
    case 'delExtra':{const k=S.menu.extras.findIndex(x=>x.id===b.dataset.id);if(k<0)return;const x=S.menu.extras.splice(k,1)[0];delete S.menu.ready[x.name];render();saveMenu();
      toast(`已刪除「${x.name}」`,()=>{S.menu.extras.splice(k,0,x);render();saveMenu();});break;}
    case 'newMeal':{const M=sortedMeals();const last=M[M.length-1];S.confirm=null;
      const wrap=last&&last.slot>=2;
      openSheet({kind:'meal',m:{id:null,day:last?(wrap?Math.min(7,last.day+1):last.day):1,slot:last?(wrap?0:last.slot+1):0,dish:'',ings:[]}});break;}
    case 'openMeal':{const m=S.menu.meals.find(x=>x.id===b.dataset.id);if(!m)return;S.confirm=null;openSheet({kind:'meal',m:clone(m)});break;}
    case 'pickSlot': readMeal();sheetState.m.slot=+b.dataset.k;refreshSheet();break;
    case 'saveMeal':{readMeal();const m=sheetState.m;if(!m.dish.trim()){toast('請填寫要煮什麼');$('#m-dish').focus();return;}
      m.dish=m.dish.trim();
      if(m.id){const k=S.menu.meals.findIndex(x=>x.id===m.id);S.menu.meals[k]=m;}else{m.id=uid();S.menu.meals.push(m);}
      closeSheet();render();saveMenu();toast('已儲存');break;}
    case 'delMeal':{
      if(S.confirm!=='meal'){setConfirm('meal');refreshSheet();return;}
      S.confirm=null;const id=sheetState.m.id;const k=S.menu.meals.findIndex(x=>x.id===id);const m=S.menu.meals.splice(k,1)[0];closeSheet();render();saveMenu();
      toast(`已刪除「${m.dish}」`,()=>{S.menu.meals.splice(k,0,m);render();saveMenu();});break;}
    case 'addForgot':{const t=S.trips.find(x=>x.id===sheetState.id);const name=forgotLines(t)[+b.dataset.k];if(!name||!S.gear)return;
      let c=S.gear.categories.find(c=>c.name==='下次記得帶');
      if(!c){c={id:uid(),name:'下次記得帶',items:[]};S.gear.categories.unshift(c);}
      c.items.push({id:uid(),name,packed:false,must:true});saveGear();refreshSheet();toast(`「${name}」已加進清單`);break;}
    case 'delTrip':{
      if(S.confirm!=='trip'){setConfirm('trip');refreshSheet();return;}
      S.confirm=null;const t=S.trips.find(x=>x.id===sheetState.id);
      try{await S.db.doc('trips/'+t.id).delete();
        if(S.assets)(t.photos||[]).forEach(id=>S.assets.delete(id).catch(()=>{}));
        closeSheet();toast('已刪除紀錄');}catch(err){handleWriteErr(err);}
      break;}
    case 'lb':{const t=S.trips.find(x=>x.id===sheetState.id);lbList=t.photos||[];lbK=+b.dataset.k;showLb();break;}
    case 'lbClose': $('#lb').hidden=true;break;
    case 'lbPrev': lbK=(lbK-1+lbList.length)%lbList.length;showLb();break;
    case 'lbNext': lbK=(lbK+1)%lbList.length;showLb();break;
    case 'undo': if(toast.undo){toast.undo();toast.undo=null;$('#toast').hidden=true;}break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target, a=el.dataset.act;
  if(a==='renameItem'||a==='noteItem'){const li=el.closest('[data-i]');const {i}=findItem(li.dataset.c,li.dataset.i);if(!i)return;const v=el.value.trim();
    if(a==='renameItem'){if(v&&v!==i.name){i.name=v;saveGear();}}else if(v!==(i.note||'')){if(v)i.note=v;else delete i.note;saveGear();}}
  if(el.id==='wx-date'||el.id==='wx-days'){normWx();if(el.id==='wx-date')S.wx.date=el.value;else S.wx.days=+el.value;saveWx();render();return;}
  if(a==='renameCat'){const c=S.gear.categories.find(c=>c.id===el.closest('[data-c]').dataset.c);const v=el.value.trim();if(c&&v&&v!==c.name){c.name=v;saveGear();}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();const cat=e.target.closest('[data-c]');
    const en=e.target.dataset.enter;en==='wxSearch'?wxSearch():en==='addItem'?addItem(cat.dataset.c):en==='addExtra'?addExtra():addCat();}
  if(e.key==='Escape'&&!$('#lb').hidden)$('#lb').hidden=true;
});
function addItem(cid){const inp=$('#add-'+cid);const v=inp.value.trim();if(!v)return;
  S.gear.categories.find(c=>c.id===cid).items.push({id:uid(),name:v,packed:false});
  render();saveGear();const n=$('#add-'+cid);n&&n.focus();}
function readMeal(){const m=sheetState.m;const d=$('#m-day');if(d)m.day=+d.value;const di=$('#m-dish');if(di)m.dish=di.value;const ig=$('#m-ings');if(ig)m.ings=[...new Set(splitIngs(ig.value))];}
function addExtra(){const inp=$('#add-extra');const v=inp.value.trim();if(!v)return;
  if(!S.menu.extras.some(x=>x.name===v))S.menu.extras.push({id:uid(),name:v});render();saveMenu();const n=$('#add-extra');n&&n.focus();}
async function wxSearch(){const f=sheetState;f.q=$('#wx-q').value.trim();if(f.q.length<2){toast('請輸入至少兩個字');return;}
  f.busy=true;f.pick=null;refreshSheet();
  try{f.res=await geoSearch(f.q);}catch(e){f.res=[];}
  f.busy=false;if(f.res.length===1)f.pick=clone(f.res[0]);refreshSheet();}
function addCat(){const inp=$('#newcat');const v=inp.value.trim();if(!v)return;
  S.gear.categories.push({id:uid(),name:v,items:[]});render();saveGear();}

async function saveTrip(){
  readForm();const f=sheetState.form;
  if(!f.date){toast('請選擇出發日期');return;}
  if(!f.place.trim()){toast('請填寫營地名稱');$('#f-place').focus();return;}
  f.saving=true;refreshSheet();
  const data={date:f.date,nights:+f.nights||0,place:f.place.trim(),area:f.area.trim(),site:f.site.trim(),
    weather:f.weather.trim(),notes:f.notes,forgot:f.forgot,rating:f.rating||0,photos:f.photos,updatedAt:new Date().toISOString()};
  try{
    let id=f.id;
    if(id)await S.db.doc('trips/'+id).set(data);
    else{const r=await S.db.collection('trips').add(data);id=r.id;}
    if(S.assets)f.removed.forEach(x=>S.assets.delete(x).catch(()=>{}));
    toast('已儲存');openSheet({kind:'detail',id});
  }catch(err){f.saving=false;refreshSheet();handleWriteErr(err);}
}
render();
</script>
<script>
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
